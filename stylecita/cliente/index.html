<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reserva tu cita · StyleCita</title>
<meta name="description" content="Mira los horarios libres, reserva tu cita y aparta productos de tu peluquería.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../shared/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../shared/icon.svg">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StyleCita">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .m-app { max-width: 560px; margin: 0 auto; min-height: 100vh; }
  .m-header { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: rgba(255, 255, 255, .9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .m-main { padding: 16px 16px calc(100px + env(safe-area-inset-bottom)); }
  .m-main > * + * { margin-top: 14px; }
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; justify-content: center; background: rgba(255, 255, 255, .97); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar-inner { display: flex; width: 100%; max-width: 560px; }
  .tabbar a { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 2px 10px; color: var(--muted); text-decoration: none; font-size: .7rem; font-weight: 600; }
  .tabbar a.active { color: var(--accent); }
  .tab-dot { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 17px; height: 17px; border-radius: 999px; background: var(--accent); color: #fff; font-size: .66rem; display: grid; place-items: center; padding: 0 4px; border: 2px solid var(--surface); }
  .hero { background: linear-gradient(135deg, rgba(29, 78, 216, .14), rgba(230, 57, 70, .07) 70%), var(--surface); }
  .hero h1 { margin: 0 0 4px; }
  .next-appt { display: flex; gap: 14px; align-items: center; }
  .date-box { width: 58px; flex: none; text-align: center; background: var(--accent); color: #fff; border-radius: 14px; padding: 8px 4px; line-height: 1.1; }
  .date-box .d { font-size: 1.5rem; font-weight: 800; }
  .date-box .m { font-size: .72rem; font-weight: 700; text-transform: uppercase; }
  .steps { display: flex; gap: 6px; }
  .steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-2); }
  .steps span.on { background: var(--accent); }
  .staff-pick { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 2px solid var(--border); color: var(--text); border-radius: 14px; padding: 12px 14px; font: inherit; cursor: pointer; }
  .staff-pick + .staff-pick { margin-top: 8px; }
  .staff-pick.active { border-color: var(--accent); }
  .date-chip { flex: none; width: 62px; border: 2px solid var(--border); background: var(--surface); color: var(--text); border-radius: 14px; padding: 8px 0; font: inherit; cursor: pointer; text-align: center; line-height: 1.15; }
  .date-chip .d { font-size: 1.25rem; font-weight: 800; }
  .date-chip .w { font-size: .72rem; color: var(--muted); font-weight: 700; text-transform: uppercase; }
  .date-chip.active { background: var(--accent); border-color: var(--accent); }
  .date-chip.active .w { color: rgba(255, 255, 255, .85); }
  .date-chip:disabled { opacity: .35; cursor: not-allowed; }
  .prod-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .prod-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .prod-card .name { font-weight: 700; font-size: .9rem; line-height: 1.25; }
  .prod-card .btn { margin-top: auto; }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty .btn { min-width: 34px; padding: 4px; }
  .back { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); background: none; border: 0; font: inherit; font-weight: 600; cursor: pointer; padding: 4px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../shared/store.js"></script>
<script src="../shared/ui.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('../sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
  }
</script>
</body>
</html>
