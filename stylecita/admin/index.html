<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel · StyleCita</title>
<meta name="description" content="Agenda, servicios, equipo, clientes y tienda de tu peluquería.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../shared/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../shared/icon.svg">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StyleCita Panel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .brand { font-weight: 800; font-size: 1.05rem; padding: 4px 8px 20px; display: flex; gap: 10px; align-items: center; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a { position: relative; display: flex; gap: 11px; align-items: center; padding: 10px 12px; border-radius: 11px; color: var(--muted); text-decoration: none; font-weight: 600; }
  .nav a:hover { background: var(--surface-2); color: var(--text); }
  .nav a.active { background: rgba(29, 78, 216, .1); color: var(--accent); }
  .nav .count { margin-left: auto; background: var(--accent); color: #fff; border-radius: 999px; font-size: .72rem; padding: 1px 7px; }
  .nav .logout { margin-top: auto; }
  .main { padding: 28px; width: 100%; max-width: 1280px; min-width: 0; }
  .actions { white-space: nowrap; text-align: right; }
  .toolbar { gap: 12px; margin-bottom: 8px; }
  .toolbar input { max-width: 340px; }

  /* Agenda por estilista */
  .agenda-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .agenda { display: grid; grid-template-columns: 58px repeat(var(--cols), minmax(170px, 1fr)); min-width: calc(58px + var(--cols) * 170px); }
  .ag-head { position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px; display: flex; gap: 9px; align-items: center; font-weight: 700; font-size: .9rem; }
  .ag-head .muted { font-weight: 500; font-size: .76rem; }
  .ag-col { position: relative; border-left: 1px solid var(--border); }
  .ag-time { position: relative; }
  .ag-time span { position: absolute; right: 8px; transform: translateY(-50%); font-size: .72rem; color: var(--muted); font-weight: 600; }
  .ag-cell { position: absolute; left: 0; right: 0; border: 0; border-top: 1px dashed rgba(15, 27, 61, .06); background: none; cursor: pointer; padding: 0; }
  .ag-cell.hour { border-top: 1px solid var(--border); }
  .ag-cell:hover { background: rgba(29, 78, 216, .07); }
  .ag-off { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(45deg, rgba(15, 27, 61, .04) 0 8px, transparent 8px 16px); pointer-events: none; }
  .ag-appt { position: absolute; left: 5px; right: 5px; z-index: 2; border: 0; border-left: 4px solid var(--c); background: color-mix(in srgb, var(--c) 22%, var(--surface-2)); color: var(--text); border-radius: 9px; padding: 5px 8px; text-align: left; font: inherit; font-size: .8rem; cursor: pointer; overflow: hidden; line-height: 1.25; }
  .ag-appt:hover { filter: brightness(1.15); }
  .ag-appt strong { display: block; font-size: .84rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag-appt.pendiente { outline: 2px dashed var(--warn); outline-offset: -2px; }
  .ag-appt.completada, .ag-appt.no_asistio { opacity: .55; }
  .ag-now { position: absolute; left: 0; right: 0; height: 2px; background: var(--bad); z-index: 4; pointer-events: none; }
  .day-nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .day-nav input { width: auto; }
  .hours-row { display: grid; grid-template-columns: 120px 1fr 1fr; gap: 8px; align-items: center; margin-top: 8px; }
  .hours-row input[type=time] { min-height: 40px; }
  .svc-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .svc-checks .check { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; font-size: .88rem; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .toolbar input { max-width: none; }
    .sidebar { height: auto; position: sticky; top: 0; z-index: 20; padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--border); }
    .brand { padding: 2px 4px 10px; }
    .nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav a { white-space: nowrap; padding: 8px 11px; }
    .nav .logout { margin-top: 0; }
    .main { padding: 18px 16px 40px; }
    .hide-sm { display: none; }
    .ag-head { top: 0; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="../shared/store.js"></script>
<script src="../shared/ui.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    // Cuando se publica una versión nueva, la app se recarga sola una vez para usarla
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('../sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
  }
</script>
</body>
</html>
