<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel del dueño · KadaMeta y Style App</title>
<meta name="description" content="Control de gimnasios (KadaMeta) y peluquerías (Style App): pagos, tarjetas y cobros automáticos.">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../shared/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../shared/icon.svg">
<meta name="theme-color" content="#0b0b0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel del dueño">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
  .sidebar { background: #050506; border-right: 1px solid var(--border); color: #fff; padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .brand { font-weight: 800; font-size: 1.05rem; padding: 4px 8px 20px; display: flex; gap: 10px; align-items: center; }
  .brand img { width: 36px; height: 36px; border-radius: 10px; }
  .brand small { display: block; font-weight: 600; color: var(--accent); font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a { position: relative; display: flex; gap: 11px; align-items: center; padding: 10px 12px; border-radius: 11px; color: var(--muted); text-decoration: none; font-weight: 600; }
  .nav a:hover { background: rgba(255, 255, 255, .08); color: #fff; }
  .nav a.active { background: rgba(201, 162, 74, .14); color: var(--accent); }
  .nav .count { margin-left: auto; background: var(--accent-2); color: var(--on-accent); border-radius: 999px; font-size: .72rem; padding: 1px 7px; }
  .nav .logout { margin-top: auto; }
  .main { padding: 28px; width: 100%; max-width: 1280px; min-width: 0; }
  .actions { white-space: nowrap; text-align: right; }
  .toolbar { gap: 12px; margin-bottom: 8px; }
  .toolbar input { max-width: 340px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: rgba(255, 255, 255, .05); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin: 0 4px 16px; }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-size: .8rem; font-weight: 700; padding: 8px 4px; border-radius: 9px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--on-accent); }
  .prod-tag { display: inline-block; font-size: .7rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); vertical-align: middle; }
  .receipt-big { display: block; max-width: 100%; max-height: 360px; margin: 0 auto; border-radius: 12px; border: 1px solid var(--border); background: #fff; }
  @media (max-width: 900px) {
    .seg { margin: 0 0 10px; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    .toolbar input { max-width: none; }
    .sidebar { height: auto; position: sticky; top: 0; z-index: 20; padding: 10px 12px; }
    .brand { padding: 2px 4px 10px; }
    .nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav a { white-space: nowrap; padding: 8px 11px; }
    .nav .logout { margin-top: 0; }
    .main { padding: 18px 16px 40px; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="../shared/store.js"></script>
<script src="../shared/ui.js"></script>
<script src="../shared/billing.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('../sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
  }
</script>
</body>
</html>
